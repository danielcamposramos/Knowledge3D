<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3D Viewer</title>
  </head>
  <body>
    <div id="ui-container" style="position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px;">
      <label for="expert-select">Select Expert House:</label>
      <select id="expert-select">
        <option value="">Loading...</option>
      </select>
      <div style="margin-top:8px;">
        <label for="agent-target">Agent target:</label>
        <input id="agent-target" placeholder="label or id" style="width: 160px;" />
        <button id="agent-go">Go</button>
        <label style="margin-left:8px;">
          <input type="checkbox" id="agent-follow" /> Follow
        </label>
      </div>
    </div>
    <canvas id="scene"></canvas>
    <div id="tooltip" style="position: absolute; display: none; background: #fff; border: 1px solid #000; padding: 2px 4px; font-size: 12px;"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
