<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3D Viewer</title>
  </head>
  <body>
    <div id="ui-container" style="position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px;">
      <label for="expert-select">Select Expert House:</label>
      <select id="expert-select">
        <option value="">Loading...</option>
      </select>
      <div style="margin-top:8px;">
        <label for="agent-target">Agent target:</label>
        <input id="agent-target" placeholder="label or id" style="width: 160px;" />
        <button id="agent-go">Go</button>
        <label style="margin-left:8px;">
          <input type="checkbox" id="agent-follow" /> Follow
        </label>
      </div>
      <div style="margin-top:8px;">
        <strong>Chat</strong>
        <div id="chat-log" style="width: 320px; height: 120px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 6px; margin-top: 4px;"></div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <input id="chat-input" placeholder="Type a message..." style="flex:1;" />
          <button id="chat-send">Send</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button id="chat-pause" title="/pause analyze">Pause</button>
          <button id="chat-resume" title="/resume">Resume</button>
          <button id="chat-status-btn" title="/status">Status</button>
          <button id="chat-ask-thoughts" title="/ask-thoughts">Ask Thoughts</button>
          <button id="chat-whoami" title="/whoami">Who am I?</button>
        </div>
        <div id="chat-status" style="font-size: 11px; color: #555; margin-top:4px;">WS: disconnected</div>
      </div>
      <div style="margin-top:8px;">
        <strong>Explain</strong>
        <div id="explain-log" style="width: 320px; height: 120px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 6px; margin-top: 4px;"></div>
      </div>
      <div style="margin-top:8px; display:flex; align-items:center; gap:8px;">
        <button id="mic-toggle">Start Mic</button>
        <div title="audio level" style="display:flex; align-items:center; gap:4px;">
          <div style="width:80px; height:8px; background:#eee; border:1px solid #ccc; position:relative;">
            <div id="mic-level" style="position:absolute; top:0; left:0; height:100%; width:0%; background:#4caf50;"></div>
          </div>
          <span id="mic-status" style="font-size:11px;color:#555;">mic: off</span>
        </div>
      </div>
      <div style="margin-top:8px;">
        <strong>Dataset</strong>
        <div id="dataset-info" style="font-size:12px; color:#333; margin-top:4px;">—</div>
        <div style="display:flex; gap:8px; margin-top:4px; align-items:center;">
          <label><input type="checkbox" id="cache-enable" checked /> Cache</label>
          <button id="cache-clear">Clear Cache</button>
        </div>
        <div id="tablet-info" style="font-size:12px; color:#333; margin-top:4px;">Tablet: offline, queue=0</div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
          <label>Tablet Mode:
            <select id="tablet-mode">
              <option value="ai" selected>AI</option>
              <option value="human">Human</option>
            </select>
          </label>
          <label><input type="checkbox" id="tablet-visible" checked /> Show Tablet</label>
        </div>
      </div>
        <strong>Coloring</strong>
        <div style="display:flex; gap:8px; margin-top:4px; align-items:center;">
          <label>Mode:
            <select id="color-mode">
              <option value="position">position</option>
              <option value="cluster">cluster-kmeans</option>
            </select>
          </label>
          <label>K: <input id="cluster-k" type="number" value="5" min="2" max="20" style="width:56px" /></label>
          <button id="apply-color">Apply</button>
          <label style="margin-left:8px;"><input type="checkbox" id="toggle-trails" checked /> Trails</label>
          <label style="margin-left:8px;"><input type="checkbox" id="toggle-lod-hud" /> LOD</label>
          <button id="tablet-focus">Focus Mode</button>
        </div>
        <div id="legend" style="margin-top:6px; font-size:12px; color:#333;"></div>
      </div>
    </div>
    <canvas id="scene"></canvas>
    <div id="tooltip" style="position: absolute; display: none; background: #fff; border: 1px solid #000; padding: 2px 4px; font-size: 12px;"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
