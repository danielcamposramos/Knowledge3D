intents:
  teleport:
    - "телепортироваться к [{x},{y},{z}]"
    - "пожалуйста, телепортируй меня к [{x}, {y}, {z}]"
  move:
    - "двигайся {direction} {distance}"
    - "идти {direction} на {distance}"
  goto:
    - "перейти к {place}"
    - "навигация к {place}"
    - "отведи меня к {place}"
    - "открой дверь к {place}"
  follow:
    - "следуй за {person}"
    - "следуй за агентом {person}"
  orbit:
    - "обойти вокруг {place}"
    - "вращаться вокруг {place}"
  show:
    - "покажи {topic}"
    - "подсвети {topic}"
  find_related:
    - "найди, связанное с {topic}"
    - "покажи похожее на {topic}"
  expand:
    - "расширь {topic}"
    - "увеличь {topic}"
  hide:
    - "скрой {object}"
    - "спрячь {object}"
  touch:
    - "коснись {object}"
    - "взаимодействуй с {object}"
  talk:
    - "поговори с {person}"
    - "спроси {person}"
  give:
    - "дай {item} {person}"
    - "передай {item} {person}"
vocab:
  directions: [влево, вправо, вверх, вниз, вперед, назад]
  places: [библиотека, рынок, хаб, ядро]
  topics: [графы, математика, физика, кластеризация, эмбеддинги, нейросети, квант]
  objects: [синий куб, красная сфера, дверь, портал, легенда, подсказка]
  persons: [гид, "агент один", "аватар алиса", боб, сотрудник, привратник, алиса]
  items: [ключ, токен, монета]

