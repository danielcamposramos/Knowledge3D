intents:
  teleport:
    - "اِنتقل إلى [{x},{y},{z}]"
    - "من فضلك انقلني إلى [{x}, {y}, {z}]"
  move:
    - "تحرك {direction} {distance}"
    - "اذهب {direction} لمسافة {distance}"
  goto:
    - "اذهب إلى {place}"
    - "تنقّل إلى {place}"
    - "خذني إلى {place}"
    - "افتح الباب إلى {place}"
  follow:
    - "اتبع {person}"
    - "اتبع الوكيل {person}"
  orbit:
    - "دُر حول {place}"
    - "حَلِّق حول {place}"
  show:
    - "أرني {topic}"
    - "قم بإبراز {topic}"
  find_related:
    - "اعثر على ما يرتبط بـ {topic}"
    - "اعرض ما يشبه {topic}"
  expand:
    - "وسّع {topic}"
    - "قرِّب {topic}"
  hide:
    - "اخفِ {object}"
    - "أخفِ {object}"
  touch:
    - "المس {object}"
    - "تفاعل مع {object}"
  talk:
    - "تحدث إلى {person}"
    - "اسأل {person}"
  give:
    - "أعطِ {item} إلى {person}"
    - "قدِّم {item} إلى {person}"
vocab:
  directions: [يسار, يمين, أعلى, أسفل, للأمام, للخلف]
  places: [المكتبة, السوق, المحور, النواة]
  topics: [الرسوم البيانية, الرياضيات, الفيزياء, التجميع, التضمين, الشبكات العصبية, الكم]
  objects: [مكعب أزرق, كرة حمراء, باب, بوابة, وسيلة الإيضاح, تلميح]
  persons: [الدليل, "الوكيل واحد", "الصورة الرمزية أليس", بوب, موظف, بواب, أليس]
  items: [مفتاح, رمز, عملة]

