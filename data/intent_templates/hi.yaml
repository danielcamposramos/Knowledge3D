intents:
  teleport:
    - "[{x},{y},{z}] पर टेलीपोर्ट"
    - "कृपया मुझे [{x}, {y}, {z}] पर टेलीपोर्ट करें"
  move:
    - "{direction} {distance} आगे बढ़ें"
    - "{direction} में {distance} यूनिट जाओ"
  goto:
    - "{place} पर जाओ"
    - "{place} तक नेविगेट करो"
    - "मुझे {place} तक ले चलो"
    - "{place} की ओर दरवाज़ा खोलो"
  follow:
    - "{person} का पीछा करो"
    - "एजेंट {person} को फ़ॉलो करो"
  orbit:
    - "{place} के चारों ओर घूमो"
    - "{place} की परिक्रमा करो"
  show:
    - "मुझे {topic} दिखाओ"
    - "{topic} को हाइलाइट करो"
  find_related:
    - "{topic} से संबंधित ढूंढो"
    - "{topic} जैसा दिखाओ"
  expand:
    - "{topic} को बड़ा करो"
    - "{topic} विस्तार करो"
  hide:
    - "{object} छिपाओ"
    - "{object} को छुपा दो"
  touch:
    - "{object} को छुओ"
    - "{object} से इंटरैक्ट करो"
  talk:
    - "{person} से बात करो"
    - "{person} से पूछो"
  give:
    - "{item} {person} को दो"
    - "{item} {person} को सौंपो"
vocab:
  directions: [बाएँ, दाएँ, ऊपर, नीचे, आगे, पीछे]
  places: [पुस्तकालय, बाज़ार, हब, कोर]
  topics: [ग्राफ़, गणित, भौतिकी, क्लस्टरिंग, एम्बेडिंग, न्यूरल नेटवर्क, क्वांटम]
  objects: [नीला घन, लाल गोला, दरवाज़ा, पोर्टल, लीजन, संकेत]
  persons: [गाइड, "एजेंट एक", "अवतार ऐलिस", बॉब, कर्मचारी, डोरमैन, ऐलिस]
  items: [चाबी, टोकन, सिक्का]

