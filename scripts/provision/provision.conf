# K3D Bare Metal Provisioning Configuration
# Edit these values before running bootstrap.sh

# --- System User ---
K3D_USER="k3d"
K3D_USER_SHELL="/bin/bash"

# --- Directories ---
K3D_HOME="/K3D"
K3D_REPO_DIR="/K3D/Knowledge3D"
K3D_LOCAL_DIR="/K3D/Knowledge3D.local"
K3D_ENVS_DIR="/K3D/Knowledge3D.local/envs"
K3D_DATASETS_DIR="/K3D/Knowledge3D.local/datasets"

# --- Repository ---
K3D_REPO_URL="https://github.com/danielcamposramos/Knowledge3D.git"
K3D_REPO_BRANCH="main"

# --- GPU ---
GPU_DRIVER_VERSION="550"
CUDA_VERSION="12.4"

# --- Miniforge ---
MINIFORGE_VERSION="latest"
MINIFORGE_URL="https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"

# --- Desktop ---
INSTALL_KDE="yes"
DISPLAY_MANAGER="sddm"

# --- VSCode ---
INSTALL_VSCODE="yes"

# --- K3D Daemon ---
K3D_DAEMON_PORT="7333"
K3D_DAEMON_STORAGE_ROOT="/K3D/Knowledge3D.local"
ENABLE_DAEMON_SERVICE="yes"

# --- Provider-Specific (MaxCloudON) ---
# No provider API needed — bare metal provisioning via SSH
# These are informational only
PROVIDER="maxcloudon"
EXPECTED_GPU="RTX 3090"
EXPECTED_CPU="Ryzen 9 5950X"
