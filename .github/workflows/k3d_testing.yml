name: Knowledge3D Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark memory_profiler

      - name: Run unit tests
        if: ${{ false }}
        run: |
          pytest tests/ -v --tb=short -m "not gpu"  # Tests disabled on CI; run locally when needed

      - name: Run benchmarks
        run: |
          echo "Skipping GPU benchmarks (no CUDA on GitHub Actions)"
          # pytest tests/benchmarks/ --benchmark-json=benchmark.json

      - name: Generate performance baseline
        run: |
          python tools/benchmarks/generate_comprehensive_baseline.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v2
        with:
          name: benchmark-results-${{ matrix.python-version }}
          path: |
            benchmark.json
            reports/

      - name: Check for performance regressions
        run: |
          if [ -f tools/check_performance_regression.py ]; then
            python tools/check_performance_regression.py
          else
            echo "Skipping performance regression check (tool not available)."
          fi
