name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest flake8 black
      - name: Lint
        run: |
          flake8
          black --check .
      - name: Tests (disabled)
        if: ${{ false }}
        run: pytest -m "not gpu"  # Tests disabled in CI; run locally when needed
